name: Retrain and Deploy

on:
  push:
    paths:
      - "data/raw.dvc"        # triggers when the DVC-tracked dataset pointer changes
      - "src/**"
      - "params.yaml"
  workflow_dispatch: {}       # allow manual trigger from the Actions tab

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull data with DVC
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
        run: dvc pull

      - name: Reproduce pipeline (prepare -> train)
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: dvc repro

      - name: Show metrics
        run: dvc metrics show

      - name: Push updated artifacts to DVC remote
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
        run: dvc push

      - name: Commit updated dvc.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dvc.lock
          git diff --staged --quiet || git commit -m "Update dvc.lock from CI retrain [skip ci]"
          git push
