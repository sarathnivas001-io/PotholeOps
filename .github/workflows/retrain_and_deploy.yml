name: Retrain and Deploy

on:
  push:
    paths:
      - "data/raw.dvc"        # triggers when the DVC-tracked dataset pointer changes
      - "src/**"
      - "params.yaml"
  workflow_dispatch: {}       # allow manual trigger from the Actions tab

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure DVC Google Drive service account
        run: |
          echo '${{ secrets.GDRIVE_SA_CREDENTIALS }}' > gdrive-sa.json
          dvc remote modify myremote --local gdrive_use_service_account true
          dvc remote modify myremote --local gdrive_service_account_json_file_path gdrive-sa.json

      - name: Pull data with DVC
        run: dvc pull

      - name: Reproduce pipeline (prepare -> train)
        env:
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: dvc repro

      - name: Show metrics
        run: dvc metrics show

      - name: Push updated artifacts to DVC remote
        run: dvc push
